services:
  api:
    build: .
    container_name: resinlogic-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RESINLOGIC_STANDALONE_MODE: "1"
      RESINLOGIC_ENFORCE_AUTH: "0"
      RESINLOGIC_DATA_DIR: "/app/local-data"
      RESINLOGIC_ENABLE_SCHEDULER: "1"
    volumes:
      - ./local-data:/app/local-data

  prometheus:
    image: prom/prometheus:latest
    container_name: resinlogic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
