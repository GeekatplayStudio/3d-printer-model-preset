<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">First launch wizard walkthrough</title>
  <desc id="desc">Illustrated guide showing the wizard page after the app starts.</desc>
  <rect width="1280" height="720" fill="#fff7f1"/>
  <rect x="40" y="36" width="1200" height="648" rx="28" fill="#ffffff" stroke="#2d1e2f" stroke-width="4"/>
  <rect x="40" y="36" width="1200" height="62" rx="28" fill="#2d1e2f"/>
  <text x="88" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff">Browser</text>
  <rect x="236" y="52" width="720" height="34" rx="17" fill="#f4f4f5"/>
  <text x="270" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#334155">http://127.0.0.1:8000/wizard</text>

  <text x="92" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d1e2f">Step 3: The wizard opens in your browser</text>
  <text x="92" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6b7280">From here, beginners can use the guided steps instead of calling API routes by hand.</text>

  <rect x="92" y="242" width="470" height="336" rx="24" fill="#fff1db" stroke="#f4a261" stroke-width="3"/>
  <text x="124" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#7c2d12">1. Pick a workflow target</text>
  <rect x="124" y="326" width="178" height="92" rx="18" fill="#ffffff" stroke="#f4a261" stroke-width="2"/>
  <text x="176" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#7c2d12">MSLA</text>
  <rect x="320" y="326" width="178" height="92" rx="18" fill="#ffffff" stroke="#f4a261" stroke-width="2"/>
  <text x="382" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#7c2d12">FDM</text>
  <text x="124" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7c2d12">The wizard leads the user through catalog setup, model upload, analysis, and settings export.</text>

  <rect x="612" y="242" width="536" height="336" rx="24" fill="#eefbf3" stroke="#52b788" stroke-width="3"/>
  <text x="644" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#14532d">Useful links after launch</text>
  <rect x="644" y="330" width="474" height="62" rx="16" fill="#ffffff" stroke="#52b788" stroke-width="2"/>
  <text x="674" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#14532d">Wizard: http://127.0.0.1:8000/wizard</text>
  <rect x="644" y="410" width="474" height="62" rx="16" fill="#ffffff" stroke="#52b788" stroke-width="2"/>
  <text x="674" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#14532d">Ops: http://127.0.0.1:8000/app</text>
  <rect x="644" y="490" width="474" height="62" rx="16" fill="#ffffff" stroke="#52b788" stroke-width="2"/>
  <text x="674" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#14532d">Catalog: http://127.0.0.1:8000/catalog/admin</text>

  <path d="M 570 410 C 612 390, 618 390, 644 390" fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
  <polygon points="624,374 652,389 624,405" fill="#e63946"/>

  <rect x="92" y="608" width="1054" height="34" rx="12" fill="#2d1e2f" opacity="0.12"/>
  <text x="108" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2d1e2f">If the page does not open immediately, wait a little longer and refresh once. The first startup is the slowest.</text>
</svg>