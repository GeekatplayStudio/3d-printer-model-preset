[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars5-agentic-slicer"
version = "0.1.0"
description = "Modular agentic backend for Mars 5 Ultra resin print analysis and parameter generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "python-multipart>=0.0.9",
  "pyvista>=0.44",
  "trimesh[easy]>=4.4",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
]
sources = [
  "youtube-transcript-api>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.json"]
